name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the build can load the config. Not real ids.
      TILL_KMS_ISSUER_ID: 00000000-0000-4000-8000-000000000000
      TILL_FINANCE_ADMIN_SLACK_IDS: UADMIN0001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build
